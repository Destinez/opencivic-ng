services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opencivic
      POSTGRES_PASSWORD: opencivic
      POSTGRES_DB: opencivic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencivic -d opencivic"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://opencivic:opencivic@db:5432/opencivic
      WEB_ORIGINS: http://localhost:3000
      SEED_ON_BOOT: "true"
      UPLOAD_DIR: /data/uploads
      PORT: "4000"
      COOKIE_SECURE: "false"
    ports:
      - "4000:4000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
